[workspace]
resolver = "2"
members = ["crates/otd-core", "crates/otd-gpu", "crates/otd-app", "crates/otd-chop", "crates/otd-engine", "crates/otd-py", "crates/otd-dat"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Ar9av/opentouchdesigner"
rust-version = "1.85"

[workspace.dependencies]
otd-core = { path = "crates/otd-core" }
otd-chop = { path = "crates/otd-chop" }
otd-gpu = { path = "crates/otd-gpu" }
otd-engine = { path = "crates/otd-engine" }

[profile.dev]
# The cook loop is unusably slow in a fully unoptimised build; dependencies
# (wgpu, naga, image codecs) get optimised even in dev.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

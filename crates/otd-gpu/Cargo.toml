[package]
name = "otd-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
fontdue = { version = "0.9.4", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tga", "tiff", "ico", "pnm"] }
log = "0.4.33"
otd-core = { version = "0.1.0", path = "../otd-core" }
otd-sop = { version = "0.1.0", path = "../otd-sop" }
pollster = "1.0.1"
serde_json = "1.0.151"
slotmap = "1.1.1"
thiserror = "2.0.19"
wgpu = { version = "29", features = ["glsl"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }

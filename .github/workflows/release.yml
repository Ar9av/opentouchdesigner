# Cut a macOS .dmg on a tag.
#
# Unsigned: signing and notarising need a paid Apple Developer account. The
# DMG carries a READ ME FIRST explaining how to get past Gatekeeper, and the
# README says the same. Pretending a build is signed when it is not would be
# worse than the extra right-click.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1.0"
        required: true

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both architectures, because a Mac user should not have to care
          # which one they have.
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # The icon is rendered by the program itself, so packaging needs the
      # one tool the renderer needs.
      - run: brew install ffmpeg
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        if: startsWith(github.ref, 'refs/tags/')
      - name: Package
        run: ./scripts/package-macos.sh "${{ steps.v.outputs.version || inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.dmg
          generate_release_notes: true
